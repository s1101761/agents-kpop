<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Pop Girl Groups Wiki</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <!-- Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-pink-500 tracking-wider">K-POP WIKI</a>
            <nav class="space-x-6 text-sm font-medium">
                <a href="index.html" class="hover:text-pink-400 transition">首頁</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="py-12 px-4 text-center bg-gradient-to-b from-slate-800 to-slate-900">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 text-white">韓國女團成員介紹知識庫</h1>
        <p class="text-slate-400 max-w-2xl mx-auto">探索各大勢女團的成員檔案、官方定位、代表作、歷代專輯與 YouTube 精彩 MV 影音。</p>
    </section>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-10">
        <h2 class="text-2xl font-bold mb-6 border-l-4 border-pink-500 pl-3">收錄女團列表</h2>
        <div id="group-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- 透過 JS 動態載入 -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-6 text-center text-slate-500 text-sm">
        <p>K-Pop Girl Groups Wiki — Built with Karpathy LLM Wiki Pattern & Tailwind CSS</p>
    </footer>

    <script>
        async function loadGroups() {
            try {
                const response = await fetch('data/groups.json');
                const data = await response.json();
                const grid = document.getElementById('group-grid');
                
                grid.innerHTML = data.groups.map(group => `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg hover:border-pink-500 transition duration-300 flex flex-col justify-between">
                        <div class="p-6">
                            <span class="text-xs font-semibold uppercase tracking-wider text-pink-400 bg-pink-950/60 px-2.5 py-1 rounded-full">${group.agency}</span>
                            <h3 class="text-2xl font-bold mt-3 text-white">${group.name}</h3>
                            <p class="text-slate-400 text-sm mb-4">${group.koreanName} · 出道：${group.debutDate}</p>
                            <p class="text-slate-300 text-sm">收錄成員：${group.members.length} 位</p>
                        </div>
                        <div class="px-6 pb-6 pt-0">
                            <a href="group.html?id=${group.id}" class="block w-full text-center bg-pink-600 hover:bg-pink-500 text-white font-medium py-2 px-4 rounded-lg transition">
                                查看詳情 & 成員
                            </a>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('載入資料失敗:', error);
            }
        }

        loadGroups();
    </script>
</body>
</html>
