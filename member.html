<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成員詳情 - K-Pop Girl Groups Wiki</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <div>
        <!-- Navbar -->
        <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <a href="index.html" class="text-2xl font-black text-pink-500 tracking-wider">K-POP WIKI</a>
                <nav class="space-x-6 text-sm font-medium">
                    <a href="index.html" class="hover:text-pink-400 transition">首頁</a>
                </nav>
            </div>
        </header>

        <!-- Member Profile Section -->
        <main class="max-w-4xl mx-auto px-4 py-16">
            <div id="member-content" class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-xl">
                <!-- 透過 JS 動態載入成員詳細資料 -->
            </div>
            <div class="mt-8">
                <a id="back-to-group" href="index.html" class="inline-block text-pink-400 hover:text-pink-300 transition">&larr; 返回團體頁面</a>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-6 text-center text-slate-500 text-sm mt-12">
        <p>K-Pop Girl Groups Wiki — Built with Karpathy LLM Wiki Pattern & Tailwind CSS</p>
    </footer>

    <script>
        async function loadMemberDetail() {
            const params = new URLSearchParams(window.location.search);
            const groupId = params.get('group');
            const memberId = params.get('member');

            try {
                const response = await fetch('data/groups.json');
                const data = await response.json();
                const group = data.groups.find(g => g.id === groupId);

                if (!group) {
                    document.getElementById('member-content').innerHTML = '<h1 class="text-2xl font-bold text-center">找不到該團體資訊</h1>';
                    return;
                }

                const member = group.members.find(m => m.id === memberId);

                if (!member) {
                    document.getElementById('member-content').innerHTML = '<h1 class="text-2xl font-bold text-center">找不到該成員資訊</h1>';
                    return;
                }

                document.title = `${member.name} (${group.name}) - K-Pop Girl Groups Wiki`;
                document.getElementById('back-to-group').href = `group.html?id=${group.id}`;

                // 修改 member.html 中的個人檔案渲染邏輯
                document.getElementById('member-content').innerHTML = `
                    <div class="flex flex-col md:flex-row gap-8 items-start">
                        <div class="w-full md:w-1/3 bg-slate-900 border border-slate-700 rounded-xl p-6 text-center">
                            <!-- 圖1：成員各自的照片（圓形大頭貼） -->
                            <div class="w-60 h-60 md:w-56 md:h-56 rounded-full overflow-hidden mx-auto mb-4 border-2 border-pink-500 shadow-lg bg-slate-800">
                                <img src="${member.image || 'https://via.placeholder.com/150'}" alt="${member.name}" class="w-full h-full object-cover">
                            </div>
                            <span class="text-xs uppercase tracking-wider text-pink-400 bg-pink-950/60 px-3 py-1 rounded-full">${group.name}</span>
                            <h2 class="text-3xl font-extrabold mt-3 text-white">${member.name}</h2>
                            <p class="text-slate-400 text-sm">${member.englishName} | ${member.koreanName}</p>
                        </div>
                        <div class="w-full md:w-2/3 space-y-6">
                            <div>
                                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">官方定位 / 擔當</h3>
                                <p class="text-xl font-bold text-pink-400 mt-1">${member.position}</p>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">生日</h3>
                                <p class="text-lg text-slate-200 mt-1">${member.birthday || '不詳'}</p>
                            </div>
                            <div>
                                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">個人簡介與經歷</h3>
                                <p class="text-slate-300 mt-2 leading-relaxed bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">${member.bio || '暫無詳細經歷介紹。'}</p>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('載入成員詳情失敗:', error);
            }
        }

        loadMemberDetail();
    </script>
</body>
</html>
